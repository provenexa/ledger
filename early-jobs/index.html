let lang = store.get('lang','mr'), city = store.get('city',''), who = store.get('who','inst');
function t(k){return L[lang][k]}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function km(a,b){const r=Math.PI/180,dl=(b[0]-a[0])*r,dn=(b[1]-a[1])*r,h=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dn/2)**2;return 6371*2*Math.asin(Math.sqrt(h))}
function n(x){return Number(x).toLocaleString(lang==='mr'?'mr-IN':lang==='hi'?'hi-IN':'en-IN')}
function origin(){if(here) return here; const [nm,st]=town.split('|'); const x=T.find(o=>o.n===nm&&o.s===st)||T[0]; return [x.lat,x.lon]}
function render(){

  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on', b.dataset.l===lang));
  // city list: Maharashtra first, then other states; cities with the most openings first
  const cnt = {};
  for (const c of C){ const k=c.city+'|'+c.city_state; cnt[k]=(cnt[k]||0)+1; }
  const keys = Object.keys(cnt).sort((x,y)=>{const [a1,s1]=x.split('|'),[a2,s2]=y.split('|');
