let lang = 'mr', dist = '';
function t(k){return L[lang][k]}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function dname(d){return lang==='mr' ? (DM[d]||d) : (d||'District to be confirmed')}
function render(){
  document.documentElement.lang = lang;
  for (const id of ['title','sub','note']) document.getElementById(id).textContent = t(id);
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on', b.dataset.l===lang));
  const counts = {}; C.forEach(c=>{counts[c.district]=(counts[c.district]||0)+1});
  const ds = Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  document.getElementById('dists').innerHTML = `<button data-d="" class="${dist===''?'on':''}">${t('all')} <small>${C.length}</small></button>` +
    ds.map(d=>`<button data-d="${esc(d)}" class="${dist===d?'on':''}">${esc(dname(d))} <small>${counts[d]}</small></button>`).join('');
  document.querySelectorAll('#dists button').forEach(b=>b.onclick=()=>{dist=b.dataset.d;render()});
  let out = '';
  for (const band of ['now','soon','early']){
    const cs = C.filter(c=>c.band===band && (dist==='' || c.district===dist));
    out += `<section class="band"><h2>${t(band)} <span class="d">(${cs.length} ${t('count')})</span></h2><p>${t(band+'_d')}</p><div class="grid">`;
    out += cs.length ? cs.map(c=>`<article class="c"><div class="top"><span class="chip">${lang==='mr'?c.kind_mr:c.kind_en}</span><span class="d">${esc(c.day)}</span></div>
      <div class="co">${esc(c.company)}</div><div class="what" title="${t('detail')}">${esc(c.what)}</div>
      <div class="row"><span class="k">${t('where')}</span><span>${esc(dname(c.district))}${c.place?' · '+esc(c.place):''}</span>
      <span class="k">${t('many')}</span><span>${c.people?esc(c.people)+' ('+(c.people_note==='announced'?t('ann'):t('est'))+')':t('na')}</span>
      <span class="k">${t('skills')}</span><span>${esc(lang==='mr'?c.skills_mr:c.skills_en)}</span></div>
      ${c.apprentices?`<div class="appr">${t('appr')}</div>`:''}
      <a href="${esc(c.url)}" target="_blank" rel="noopener">${t('src')} ↗</a></article>`).join('') : `<p class="empty">—</p>`;
    out += '</div></section>';
  }
  document.getElementById('bands').innerHTML = out;
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;render()});
render();
