      ${c.appr?`<span class="k">${t('appr')}</span><span>${n(c.appr)}</span>`:''}
      <span class="k">${t('skills')}</span><span>${esc(lang==='mr'?c.skills_mr:lang==='hi'?c.skills_hi:c.skills_en)}</span></div>
      <a href="${esc(c.url)}" target="_blank" rel="noopener">${t('src')} ↗</a></article>`).join('') : `<p class="empty">${t('none')}</p>`;
    out += '</div></section>';
  }
  document.getElementById('bands').innerHTML = out;
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l; store.set('lang',lang); render();});
render();
</script></body></html>
